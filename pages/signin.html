<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول - منصة الفضل للاتصالات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/font-awesome-pro.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="auth-page-body">

  <div class="auth-card card-login">
    <div class="auth-header">
      <div class="login-brand-logo-container">
        <a href="../index.html">
          <img src="../src/image/logo.webp" alt="الفضل للاتصالات" class="login-brand-img" />
        </a>
      </div>

      <h1 class="auth-title">الفضل للاتصالات</h1>
      <p class="auth-subtitle">تسجيل الدخول إلى حسابك</p>

      <div class="security-badges">
        <div class="security-badge-item">
          <i class="fa-solid fa-lock lock-icon"></i>
          <span>اتصال مشفر</span>
        </div>
        <div class="security-badge-item">
          <i class="fa-solid fa-shield-halved shield-icon"></i>
          <span>بيانات محمية</span>
        </div>
      </div>
    </div>

    <form id="loginForm" autocomplete="off" action="home.html" onsubmit="event.preventDefault(); window.location.href='home.html';">
      <div class="auth-form-group">
        <label for="loginEmail" class="auth-label">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="example@email.com" required />
      </div>

      <div class="auth-form-group">
        <label for="loginPassword" class="auth-label">كلمة المرور</label>
        <div class="auth-input-wrapper">
          <input type="password" id="loginPassword" class="form-control" placeholder="........" required />
          <button type="button" id="toggleLoginPasswordBtn" class="password-toggle-btn" aria-label="عرض كلمة المرور">
            <i class="fa-regular fa-eye" id="toggleLoginPasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="remember-forgot-row">
        <div class="remember-checkbox-group">
          <input type="checkbox" id="rememberMe" />
          <label for="rememberMe">تذكرني</label>
        </div>
        <a href="forgetpassword.html" class="forgot-pass-link">نسيت كلمة المرور؟</a>
      </div>

      <button type="submit" id="loginSubmitBtn" class="auth-btn-primary auth-btn-dark">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>تسجيل الدخول</span>
      </button>
    </form>

    <div class="auth-divider"></div>

    <div class="auth-footer-prompt">
      ليس لديك حساب؟ <a href="signup.html">إنشاء حساب جديد</a>
    </div>

    <div class="auth-legal-footer">
      <div>شركة فضل المتحدة - سجل تجاري 7017634457</div>
      <div class="legal-links mt-1">
        <a href="#" onclick="event.preventDefault()">الشروط والأحكام</a> | <a href="#" onclick="event.preventDefault()">سياسة الخصوصية</a>
      </div>
    </div>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
