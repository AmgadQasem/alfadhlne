<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إنشاء حساب جديد - منصة الفضل للاتصالات</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/font-awesome-pro.css?v=1.1" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="../css/bootstrap.min.css?v=1.1" />

  <link rel="stylesheet" href="../css/style.css?v=1.1" />
</head>

<body class="auth-page-body">

  <div class="auth-card card-signup">
    <div class="auth-header">
      <div class="auth-header-inline">
        <h1 class="auth-title">
          <i class="fa-solid fa-id-card ms-1"></i>
          إنشاء حساب جديد
        </h1>
      </div>
      <p class="auth-subtitle">منصة الفضل للاتصالات</p>
    </div>

    <form id="signupForm" autocomplete="off">
      <div class="auth-form-group">
        <label for="fullName" class="auth-label">الاسم الكامل <span class="required-star">*</span></label>
        <input type="text" id="fullName" class="form-control" placeholder="محمد بن عبدالله الشمري" required />
      </div>

      <div class="auth-form-group">
        <label for="nationalId" class="auth-label">رقم الهوية الوطنية / الإقامة <span class="required-star">*</span></label>
        <input type="text" id="nationalId" class="form-control" placeholder="1XXXXXXXXX" maxlength="10" pattern="[0-9]{10}" title="يرجى إدخال 10 أرقام" required />
      </div>

      <div class="auth-form-group">
        <label for="phoneNumber" class="auth-label">رقم الجوال <span class="required-star">*</span></label>
        <input type="tel" id="phoneNumber" class="form-control" placeholder="05XXXXXXXX" maxlength="10" pattern="05[0-9]{8}" title="يرجى إدخال رقم جوال يبدأ بـ 05 ومكون من 10 أرقام" required />
      </div>

      <div class="auth-form-group">
        <label for="emailAddress" class="auth-label">البريد الإلكتروني <span class="required-star">*</span></label>
        <input type="email" id="emailAddress" class="form-control" placeholder="example@email.com" required />
      </div>

      <div class="auth-form-group">
        <label for="city" class="auth-label">المدينة / المحافظة</label>
        <input type="text" id="city" list="saudiCities" class="form-control" placeholder="ابحث عن مدينتك..." />
        <datalist id="saudiCities">
          <option value="الرياض"></option>
          <option value="جدة"></option>
          <option value="مكة المكرمة"></option>
          <option value="المدينة المنورة"></option>
          <option value="الدمام"></option>
          <option value="الخبر"></option>
          <option value="الأحساء"></option>
          <option value="القصيم"></option>
          <option value="الطائف"></option>
          <option value="تبوك"></option>
          <option value="أبها"></option>
          <option value="حائل"></option>
          <option value="جازان"></option>
          <option value="نجران"></option>
          <option value="الجبيل"></option>
          <option value="ينبع"></option>
        </datalist>
      </div>

      <div class="verification-box">
        <div class="verification-title">طريقة توثيق الحساب</div>
        <div class="verification-options">
          <div class="custom-radio-group">
            <input type="radio" name="authMethod" id="authEmail" value="email" checked />
            <label for="authEmail">البريد الإلكتروني</label>
          </div>
          <div class="custom-radio-group">
            <input type="radio" name="authMethod" id="authSms" value="sms" />
            <label for="authSms">رسالة SMS</label>
          </div>
        </div>
        <div class="verification-subtext">
          SMS مخصص، لكود التحقق فقط ويخضع لحدود إرسال لمنع استهلاك الرصيد
        </div>
      </div>

      <div class="auth-form-group">
        <label for="password" class="auth-label">كلمة المرور <span class="required-star">*</span> <span class="pass-hint">(8 أحرف على الأقل)</span></label>
        <div class="auth-input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="........" minlength="8" required />
          <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="عرض كلمة المرور">
            <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
      </div>

      <div class="terms-card-box">
        <div class="terms-header-title">
          <i class="fa-solid fa-scroll"></i>
          <span>الموافقة على الشروط (مطلوبة قبل المتابعة)</span>
        </div>

        <div class="term-item">
          <input type="checkbox" class="term-checkbox" id="term1" required />
          <label for="term1" class="term-label">
            أقر بأنني قرأت وفهمت <a href="#" onclick="event.preventDefault()">الشروط والأحكام</a> ووافقت عليها، وعلى جميع أحكام <a href="#" onclick="event.preventDefault()">عقد التوكيل الرقمي</a> الذي سأوقعه إلكترونياً بعد مكتمل الحجز.
          </label>
        </div>

        <div class="term-item">
          <input type="checkbox" class="term-checkbox" id="term2" required />
          <label for="term2" class="term-label">
            أوافق على <a href="#" onclick="event.preventDefault()">سياسة الخصوصية</a> وأصرح بمعالجة بياناتي الشخصية لغرض تقديم الخدمة، وفق نظام حماية البيانات الشخصية السعودي.
          </label>
        </div>

        <div class="term-item">
          <input type="checkbox" class="term-checkbox" id="term3" required />
          <label for="term3" class="term-label">
            أقر بأن إدخال <strong>رمز التحقق (OTP)</strong> عند توقيع العقد يُعد <strong>توقيعاً إلكترونياً ملزماً قانونياً</strong> وفق نظام التعاملات الإلكترونية السعودي (المرسوم الملكي م/18).
          </label>
        </div>

        <div class="terms-legal-notice">
          <i class="fa-solid fa-circle-info"></i>
          <span>يتم تسجيل موافقتك مع الوقت وعنوان IP لأغراض التوثيق القانوني.</span>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="auth-btn-primary auth-btn-blue" disabled>
        إنشاء الحساب وإرسال رمز التحقق
      </button>
    </form>

    <div class="auth-footer-prompt">
      لديك حساب؟ <a href="signin.html">تسجيل الدخول</a>
    </div>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js?v=1.1"></script>
</body>

</html>
