<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور - منصة الفضل للاتصالات</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/font-awesome-pro.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="../css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="auth-page-body">

  <div class="auth-card card-login">
    <div class="auth-header">
      <div class="auth-header-inline">
        <h1 class="auth-title">
          <i class="fa-solid fa-key auth-naked-icon ms-1"></i>
          استعادة كلمة المرور 
        </h1>
      </div>
      <p class="auth-subtitle">منصة الفضل للاتصالات</p>
    </div>

    <form id="forgetPasswordForm" autocomplete="off">
      <div class="verification-box">
        <div class="verification-title">طريقة الاستعادة</div>
        <div class="verification-options">
          <div class="custom-radio-group">
            <input type="radio" name="resetMethod" id="resetEmail" value="email" checked />
            <label for="resetEmail">البريد الإلكتروني</label>
          </div>
          <div class="custom-radio-group">
            <input type="radio" name="resetMethod" id="resetSms" value="sms" />
            <label for="resetSms">رسالة SMS</label>
          </div>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="recoveryInput" id="recoveryLabel" class="auth-label">البريد الإلكتروني المسجل</label>
        <input type="email" id="recoveryInput" class="form-control" placeholder="name@example.com" required />
      </div>

      <button type="submit" id="forgetSubmitBtn" class="auth-btn-primary auth-btn-dark mt-4">
        <i class="fa-solid fa-paper-plane"></i>
        <span>إرسال تعليمات الاستعادة</span>
      </button>
    </form>

    <div class="auth-divider"></div>

    <div class="auth-footer-prompt mb-0">
      تذكرت كلمة المرور؟ <a href="signin.html">تسجيل الدخول</a>
    </div>
  </div>

  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
